<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>AutoZoom setup</title>
  <link rel="stylesheet" href="setup.css">
</head>
<body>
  <header class="header">
    <img class="logo" src="../../icons/icon-48.png" width="28" height="28" alt="">
    <div>
      <h1 id="title" class="title">Set up AutoZoom</h1>
      <p id="subtitle" class="subtitle">Choose a default zoom for each screen. AutoZoom applies it automatically whenever a window is on that screen.</p>
    </div>
  </header>

  <main id="rows" class="rows" aria-live="polite" aria-busy="true">
    <p class="loading">Detecting displays…</p>
  </main>

  <footer class="footer">
    <p id="hint" class="hint">You can change these anytime from the AutoZoom toolbar icon.</p>
    <div class="actions">
      <button id="apply" class="btn primary" type="button" disabled>Apply</button>
    </div>
  </footer>

  <template id="row-template">
    <section class="row">
      <div class="row-main">
        <div class="row-name"></div>
        <div class="row-meta">
          <span class="pill pill-class"></span>
          <span class="pill pill-status"></span>
        </div>
      </div>
      <div class="stepper" role="group">
        <button class="step-btn step-down" type="button" aria-label="Decrease zoom">−</button>
        <select class="zoom-select" aria-label="Default zoom"></select>
        <button class="step-btn step-up" type="button" aria-label="Increase zoom">+</button>
      </div>
    </section>
  </template>

  <script type="module" src="setup.js"></script>
</body>
</html>
